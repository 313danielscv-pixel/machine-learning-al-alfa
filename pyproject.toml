[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-learning-al-alfa"
version = "0.1.0"
description = "California housing regression and Madrid Airbnb price estimation project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.4",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "scikit-learn>=1.6",
    "seaborn>=0.13",
    "streamlit>=1.41",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]
